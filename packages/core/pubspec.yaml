name: quick_attend_core
description: "Phần dùng chung của Hereby: model, service Firestore, theme và widget Lab 2."
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  firebase_core: ^5.0.0
  firebase_auth: ^7.0.0
  cloud_firestore: ^7.0.0
  firebase_analytics: ^13.0.0
  firebase_remote_config: ^7.0.0
  firebase_app_check: ^0.5.1
  google_sign_in: ^7.2.0
  intl: ">=0.19.0 <0.21.0"
  # Lưu bảng màu đã chọn (D-L3-12)
  shared_preferences: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=5.0.0 <7.0.0"

flutter:
  uses-material-design: true
  # Nunito đóng gói sẵn (OFL, fonts/OFL.txt), không tải lúc chạy: Windows, máy mất mạng và
  # extension đều ra cùng một font. Bốn bản tĩnh cắt từ Nunito[wght].ttf của google/fonts.
  fonts:
    - family: Nunito
      fonts:
        - asset: fonts/Nunito-Regular.ttf
        - asset: fonts/Nunito-Medium.ttf
          weight: 500
        - asset: fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: fonts/Nunito-Bold.ttf
          weight: 700
