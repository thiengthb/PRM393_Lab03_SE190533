name: quick_attend_core
description: "Phần dùng chung của Quick Attend: model, service Firestore, theme và widget Lab 2."
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  firebase_core: ^5.0.0
  firebase_auth: ^7.0.0
  cloud_firestore: ^7.0.0
  firebase_analytics: ^13.0.0
  firebase_remote_config: ^7.0.0
  firebase_app_check: ^0.5.1
  google_sign_in: ^7.2.0
  # google_fonts 9 dùng gói material_ui riêng, không khớp ThemeData của Flutter 3.47
  google_fonts: ">=6.2.0 <9.0.0"
  intl: ">=0.19.0 <0.21.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=5.0.0 <7.0.0"

flutter:
  uses-material-design: true
