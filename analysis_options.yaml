include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - lib/firebase_options.dart
    - build/**
    - android/**
    - web/**
  language:
    strict-casts: true

linter:
  rules:
    - prefer_const_constructors
    - prefer_final_locals
    - avoid_print
    - use_build_context_synchronously
