[project]
name = "quick-attend-e2e"
version = "0.1.0"
description = "ARTEMIS E2E tests for Quick Attend (PRM393 Lab 3)"
requires-python = ">=3.12"
dependencies = [
  # Ghim commit ARTEMIS đã dùng (README, mục Phiên bản).
  "artemis-client @ git+https://github.com/google/artemis.git@351ca8422f7b5b54e80a9c1ce03a222e02415b6b#subdirectory=packages/artemis-client",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-repeat>=0.9.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "native: tương tác native (hộp chọn tài khoản, hộp quyền, thông báo)",
  "error_path: đường lỗi",
  "student: chạy với bản build PORTAL=student",
  "exploratory: phiên khám phá profile Pro, không chạy trong hồi quy",
]
addopts = "-m 'not exploratory' --junitxml=runs/junit.xml -p no:cacheprovider"
