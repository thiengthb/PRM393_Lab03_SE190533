name: quick_attend
description: "Quick Attend · PRM393 Lab 3 · điểm danh bằng mã QR cho giảng viên FPTU, sinh viên quét mã và xem chuyên cần."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

# Ràng buộc dạng khoảng để pub chọn bản mới nhất hợp với Flutter trên máy.
# Bản thật sự dùng được ghi trong pubspec.lock và README (mục Phiên bản).
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management + điều hướng
  flutter_riverpod: ^3.0.0
  go_router: ">=16.0.0 <19.0.0"

  # Firebase (6 dịch vụ + Firestore)
  firebase_core: ^5.0.0
  firebase_auth: ^7.0.0
  cloud_firestore: ^7.0.0
  firebase_storage: ^14.0.0
  firebase_messaging: ^17.0.0
  firebase_analytics: ^13.0.0
  firebase_crashlytics: ^6.0.0
  firebase_remote_config: ^7.0.0
  google_sign_in: ^7.2.0

  # Giao diện và tính năng
  google_fonts: ">=6.2.0 <10.0.0"
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.0.0
  file_selector: ^1.0.3
  excel: ^4.0.6
  pdf: ^3.11.0
  printing: ^5.14.0
  shared_preferences: ^2.5.0
  flutter_local_notifications: ">=21.0.0 <23.0.0"
  timezone: ">=0.10.0 <0.12.0"
  intl: ">=0.19.0 <0.21.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=5.0.0 <7.0.0"

flutter:
  uses-material-design: true
