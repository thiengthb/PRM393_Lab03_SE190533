name: E2E builds

# Dựng sẵn bản web chạy với Firebase Emulator để chạy test luồng (Playwright) ở máy không cài Flutter.
# Kết quả đẩy lên nhánh e2e-builds (một commit, ghi đè mỗi lần).
on:
  push:
    branches: [claude/e2e-flows]
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.47.3"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Analyze, test
        run: |
          set -e
          (cd packages/core && flutter pub get && flutter analyze --no-fatal-infos)
          (cd mobile && flutter pub get && flutter analyze --no-fatal-infos && flutter test)
          (cd web && flutter pub get && flutter analyze --no-fatal-infos && flutter test)
      - name: Build web
        run: |
          set -e
          E="--release --no-web-resources-cdn --dart-define=EMULATOR_HOST=localhost"
          (cd mobile && flutter pub get && flutter build web $E --dart-define=PORTAL=lecturer -o /tmp/out/lecturer)
          (cd mobile && flutter build web $E --dart-define=PORTAL=student -o /tmp/out/student)
          (cd web && flutter pub get && flutter build web $E --dart-define=EMULATOR_LOGIN=admin@fe.edu.vn -o /tmp/out/admin)
          (cd web && flutter build web $E --dart-define=EMULATOR_LOGIN=giaovu@fe.edu.vn -o /tmp/out/giaovu)
      - name: Firestore emulator jar
        working-directory: firebase/tests
        run: |
          npm ci
          npx firebase-tools setup:emulators:firestore
          mkdir -p /tmp/out/emulators
          cd ~/.cache/firebase/emulators
          for f in cloud-firestore-emulator-*.jar; do split -b 60m "$f" "/tmp/out/emulators/$f.part-"; sha256sum "$f" > "/tmp/out/emulators/$f.sha256"; done
          cd -
          npx firebase-tools --version > /tmp/out/emulators/firebase-tools-version.txt
      - name: Push to e2e-builds
        run: |
          cd /tmp/out
          echo "${GITHUB_SHA}" > SOURCE_SHA
          git init -q -b e2e-builds
          git config user.name thiengthb
          git config user.email tranngocthien697@gmail.com
          git add -A
          git commit -qm "E2E builds từ ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" e2e-builds
