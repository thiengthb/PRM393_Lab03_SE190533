name: "Demo: Firebase thật"

# Chỉ chạy khi người bấm "Run workflow" (Actions → Demo: Firebase thật). Ghi vào project Firebase THẬT.
#   deploy      đẩy Security Rules, chỉ mục, Remote Config và Hosting (web sinh viên /, admin /admin/,
#               FAP giả lập /fap/, file lớp mẫu /demo/)
#   reset_data  XOÁ SẠCH Firestore và tài khoản có "+demo" trong email, rồi nạp lại dữ liệu demo
#               (seed-demo.mjs --real --reset --live-now --demo): có một slot đang diễn ra trong 2 giờ tới.
#               Dữ liệu giảng viên mẫu và sinh viên mẫu nạp vào hai nick Gmail (đăng nhập Google là vào thẳng):
#               lấy từ ô nhập, bỏ trống thì lấy từ secret DEMO_GOOGLE_LECTURER, DEMO_GOOGLE_STUDENT, DEMO_ADMIN_EMAIL.
#               Để email trong secret thì không lộ ra repo công khai và mỗi lần reset chỉ cần bấm nút.
# Cần secret FIREBASE_SERVICE_ACCOUNT (nội dung file khoá JSON), cách tạo ở docs/demo/HUONG-DAN.md.
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Đẩy Rules, chỉ mục, Remote Config, Hosting"
        type: boolean
        default: true
      reset_data:
        description: "Xoá sạch dữ liệu và nạp lại dữ liệu demo"
        type: boolean
        default: true
      admin_email:
        description: "Gmail được làm Quản trị web admin (đã đăng nhập Google vào /admin một lần). Trống: secret DEMO_ADMIN_EMAIL"
        type: string
        default: ""
      google_lecturer:
        description: "Gmail nhận dữ liệu giảng viên mẫu (4 lớp, slot đang diễn ra). Trống: secret DEMO_GOOGLE_LECTURER, không có thì quanm@fe.edu.vn"
        type: string
        default: ""
      google_student:
        description: "Gmail nhận dữ liệu sinh viên mẫu SE190101. Trống: secret DEMO_GOOGLE_STUDENT, không có thì dung101@fpt.edu.vn"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: demo-firebase
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.47.3"
  PROJECT: attendo-app-2611

jobs:
  firebase:
    runs-on: ubuntu-latest
    steps:
      - name: Kiểm tra khoá
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::Chưa có secret FIREBASE_SERVICE_ACCOUNT. Làm theo docs/demo/HUONG-DAN.md phần 'Khoá cho GitHub'."
            exit 1
          fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          python3 -c "import json,sys; d=json.load(open(sys.argv[1])); assert d.get('type')=='service_account', 'không phải khoá service account'; assert d.get('project_id')=='${{ env.PROJECT }}', 'khoá của project khác: '+str(d.get('project_id')); print('Khoá của', d['client_email'])" "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Công cụ Firebase
        working-directory: firebase/tests
        run: npm ci --no-audit --no-fund
      - uses: subosito/flutter-action@v2
        if: inputs.deploy
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Dựng Hosting
        if: inputs.deploy
        run: ./tool/build_hosting.sh
      - name: Hosting sites (sinh viên, admin, TV, FAP giả)
        if: inputs.deploy
        working-directory: firebase
        run: |
          # Create the extra sites once (decision 002); the student site is the project's default site.
          for site in "$PROJECT-admin" "$PROJECT-tv" "$PROJECT-fap"; do
            ./tests/node_modules/.bin/firebase hosting:sites:get "$site" --project "$PROJECT" > /dev/null 2>&1 \
              || ./tests/node_modules/.bin/firebase hosting:sites:create "$site" --project "$PROJECT" --non-interactive \
              || { echo "::error::Cannot read or create Hosting site $site. Give the service account the roles 'Firebase Admin' and 'Service Usage Consumer' (docs/setup/FIREBASE-MOI.md, step 7)."; exit 1; }
          done
          # Map targets to this project's sites, so .firebaserc does not need to know the project.
          ./tests/node_modules/.bin/firebase target:clear hosting student --project "$PROJECT" || true
          ./tests/node_modules/.bin/firebase target:apply hosting student "$PROJECT" --project "$PROJECT"
          for t in admin tv fap; do
            ./tests/node_modules/.bin/firebase target:clear hosting "$t" --project "$PROJECT" || true
            ./tests/node_modules/.bin/firebase target:apply hosting "$t" "$PROJECT-$t" --project "$PROJECT"
          done
      - name: Deploy
        if: inputs.deploy
        working-directory: firebase
        run: |
          ./tests/node_modules/.bin/firebase deploy --project "$PROJECT" --non-interactive --force \
            --only firestore:rules,firestore:indexes,remoteconfig,hosting
      - name: Nạp dữ liệu demo
        if: inputs.reset_data
        working-directory: firebase/tests
        env:
          ADMIN_EMAIL: ${{ inputs.admin_email || secrets.DEMO_ADMIN_EMAIL }}
          GOOGLE_LECTURER: ${{ inputs.google_lecturer || secrets.DEMO_GOOGLE_LECTURER }}
          GOOGLE_STUDENT: ${{ inputs.google_student || secrets.DEMO_GOOGLE_STUDENT }}
        run: |
          # Personal Gmail addresses: keep them out of the public log and summary.
          for e in $(echo "$ADMIN_EMAIL,$GOOGLE_LECTURER,$GOOGLE_STUDENT" | tr ',' ' '); do echo "::add-mask::$e"; done
          node seed-demo.mjs --real --project "$PROJECT" --reset --live-now --demo \
            ${ADMIN_EMAIL:+--admin-email "$ADMIN_EMAIL"} \
            ${GOOGLE_LECTURER:+--google-lecturer "$GOOGLE_LECTURER"} \
            ${GOOGLE_STUDENT:+--google-student "$GOOGLE_STUDENT"} | tee seed.txt
      - name: Tóm tắt
        if: always()
        run: |
          {
            echo "## Firebase thật: $PROJECT"
            echo "- Web sinh viên: https://$PROJECT.web.app/"
            echo "- Web admin: https://$PROJECT-admin.web.app/"
            echo "- Màn chiếu TV: https://$PROJECT-tv.web.app/tv/<khoá> (app tạo link)"
            echo "- FAP giả lập: https://$PROJECT-fap.web.app/fap/"
            echo "- File lớp mẫu: https://$PROJECT.web.app/demo/lop-fall-2026.csv"
            # The summary is public in a public repo: hide personal Gmail addresses.
            if [ -f firebase/tests/seed.txt ]; then echo; echo '```'; tail -3 firebase/tests/seed.txt | sed -E 's/[A-Za-z0-9._%+-]+@gmail\.com/<Gmail>/g'; echo '```'; fi
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f "$RUNNER_TEMP/sa.json"
