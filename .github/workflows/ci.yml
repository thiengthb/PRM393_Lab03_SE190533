name: CI

on:
  push:
    branches: [main, final-system, ui-v2]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

# A new push to the same branch or PR cancels the run still in progress.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.3"

jobs:
  # Decide which jobs this change needs, so a Dart-only fix does not wait for the extension,
  # Rules or Windows jobs and the other way round. Pushes to final-system run everything.
  changes:
    name: Changed areas
    runs-on: ubuntu-latest
    outputs:
      flutter: ${{ steps.f.outputs.flutter }}
      extension: ${{ steps.f.outputs.extension }}
      rules: ${{ steps.f.outputs.rules }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            flutter:
              - 'packages/**'
              - 'mobile/**'
              - 'web/**'
              - 'tool/build_hosting.sh'
              - '.github/workflows/ci.yml'
            extension:
              - 'extension/**'
              - 'fap-mock/**'
              - 'tool/fcm/**'
              - '.github/workflows/ci.yml'
            rules:
              - 'firebase/**'
              - '.github/workflows/ci.yml'

  flutter:
    name: Analyze, test, build web
    needs: changes
    if: needs.changes.outputs.flutter == 'true' || github.ref == 'refs/heads/final-system'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Core
        working-directory: packages/core
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
      - name: Mobile (app giảng viên + cổng sinh viên)
        working-directory: mobile
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test
      - name: Web admin
        working-directory: web
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test
      - name: Dựng Hosting (cổng sinh viên ở /, quản trị ở /admin/)
        run: ./tool/build_hosting.sh
      - uses: actions/upload-artifact@v4
        with:
          name: hosting-public
          path: firebase/public
          retention-days: 7

  # The Windows build takes the longest; it only runs where an installable build is needed.
  windows:
    name: Build Windows (desktop giảng viên)
    needs: changes
    if: github.ref == 'refs/heads/final-system' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'windows')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: flutter build windows
        working-directory: mobile
        run: |
          flutter pub get
          flutter build windows --release
      # Tải thư mục Release về là chạy được hereby.exe, không cần cài Flutter.
      - uses: actions/upload-artifact@v4
        with:
          name: hereby-windows
          path: mobile/build/windows/x64/runner/Release
          retention-days: 7

  extension:
    name: Extension, FAP giả lập, script FCM
    needs: changes
    if: needs.changes.outputs.extension == 'true' || github.ref == 'refs/heads/final-system'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: FAP giả lập (test, build)
        working-directory: fap-mock
        run: |
          npm ci --no-audit --no-fund
          npm run check
      - name: Script gửi FCM (test hàm dựng tin)
        working-directory: tool/fcm
        run: |
          npm ci --no-audit --no-fund
          npm test
      - name: Extension (typecheck, lint, prettier, test, build, kiểm tra dist)
        working-directory: extension
        run: |
          npm ci --no-audit --no-fund
          npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: hereby-extension
          path: extension/dist
          retention-days: 7

  rules:
    name: Security Rules trên Emulator
    needs: changes
    if: needs.changes.outputs.rules == 'true' || github.ref == 'refs/heads/final-system'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Chạy test Rules
        working-directory: firebase/tests
        run: |
          npm ci
          npx firebase-tools emulators:exec --config ../firebase.json --project demo-hereby --only firestore "node --test rules.test.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rules-test-results
          path: evidence/rules/rules-test-results.md
