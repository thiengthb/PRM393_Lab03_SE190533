name: CI

on:
  push:
    branches: [main, ui-v2]
  pull_request:

permissions:
  contents: read

jobs:
  flutter:
    name: Analyze, test, build web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.3"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build web --release

  rules:
    name: Security Rules trên Emulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Chạy test Rules
        working-directory: firebase/tests
        run: |
          npm ci
          npx firebase-tools emulators:exec --config ../../firebase.json --project demo-hereby --only firestore "node --test rules.test.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rules-test-results
          path: evidence/rules/rules-test-results.md
