name: quick_attend_admin
description: "Quick Attend · web admin cho giáo vụ và quản trị (Flutter Web trên Firebase Hosting)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  quick_attend_core:
    path: ../packages/core
  flutter_riverpod: ^3.0.0
  go_router: ">=16.0.0 <19.0.0"
  firebase_core: ^5.0.0
  firebase_remote_config: ^7.0.0
  firebase_auth: ^7.0.0
  cloud_firestore: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=5.0.0 <7.0.0"

flutter:
  uses-material-design: true
